<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Preguntas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Bienvenido al Quiz de Preguntas</h1>
    </header>

    <main class="quiz-container">
        <p class="quiz-instructions">Responde las siguientes preguntas de opción múltiple:</p>

        <form>
            <ol class="quiz-list">
                
                <!-- Pregunta 1 -->
                <li class="quiz-card">
                    <h2 class="pregunta-titulo">¿Cuánto es 2 + 2?</h2>
                    <ul class="respuestas-list">
                        <li>
                            <label><input type="radio" name="p1" value="1"> 3</label>
                        </li>
                        <li>
                            <label><input type="radio" name="p1" value="2"> 4</label>
                        </li>
                        <li>
                            <label><input type="radio" name="p1" value="3"> 5</label>
                        </li>
                    </ul>
                </li>

                <!-- Pregunta 2 -->
                <li class="quiz-card">
                    <h2 class="pregunta-titulo">¿Cuál es la capital de Francia?</h2>
                    <ul class="respuestas-list">
                        <li>
                            <label><input type="radio" name="p2" value="1"> París</label>
                        </li>
                        <li>
                            <label><input type="radio" name="p2" value="2"> Londres</label>
                        </li>
                        <li>
                            <label><input type="radio" name="p2" value="3"> Roma</label>
                        </li>
                    </ul>
                </li>

                <!-- Pregunta 3 -->
                <li class="quiz-card">
                    <h2 class="pregunta-titulo">¿Cuál es el color del cielo?</h2>
                    <ul class="respuestas-list">
                        <li>
                            <label><input type="radio" name="p3" value="1"> Azul</label>
                        </li>
                        <li>
                            <label><input type="radio" name="p3" value="2"> Verde</label>
                        </li>
                        <li>
                            <label><input type="radio" name="p3" value="3"> Rojo</label>
                        </li>
                    </ul>
                </li>

                <!-- Pregunta 4 -->
                <li class="quiz-card">
                    <h2 class="pregunta-titulo">¿Cuál es el animal más grande del mundo?</h2>
                    <ul class="respuestas-list">
                        <li>
                            <label><input type="radio" name="p4" value="1"> Elefante</label>
                        </li>
                        <li>
                            <label><input type="radio" name="p4" value="2"> Ballena azul</label>
                        </li>
                        <li>
                            <label><input type="radio" name="p4" value="3"> Jirafa</label>
                        </li>
                    </ul>
                </li>

                <!-- Pregunta 5 -->
                <li class="quiz-card">
                    <h2 class="pregunta-titulo">¿Cuál es el país más grande del mundo?</h2>
                    <ul class="respuestas-list">
                        <li>
                            <label><input type="radio" name="p5" value="1"> Rusia</label>
                        </li>
                        <li>
                            <label><input type="radio" name="p5" value="2"> Estados Unidos</label>
                        </li>
                        <li>
                            <label><input type="radio" name="p5" value="3"> China</label>
                        </li>
                    </ul>
                </li>

            </ol>
            
            <button type="submit" class="submit-btn">Enviar respuestas</button>
        </form>
    </main>
<script src="script.js"></script>
</body>
</html>
